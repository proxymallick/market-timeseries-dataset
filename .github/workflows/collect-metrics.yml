name: Collect public metrics

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Collect metrics
        run: python scripts/collect_metrics.py
      - name: Commit metrics history
        if: always()
        run: |
          if git diff --quiet -- metrics/metrics_log.csv; then
            echo "No metric changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/metrics_log.csv
          git commit -m "Update hosting metrics"
          git push
